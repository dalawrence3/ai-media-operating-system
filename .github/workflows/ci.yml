name: CI

on:
  push:
    branches: ["main", "phase-*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend lint + test ────────────────────────────────────────────────────
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src/ tests/

      - name: Type check (ruff format check)
        run: python -m ruff format --check src/ tests/

      - name: Run tests
        env:
          ACE_DRY_RUN: "1"
          ACE_AI_PROVIDER: "fake"
          ACE_TTS_PROVIDER: "fake"
          ACE_TTS_LIVE_ENABLED: "false"
          ACE_PUBLISHING_LIVE_ENABLED: "false"
        run: |
          python -m pytest -x -q \
            --tb=short \
            --no-header \
            tests/

  # ── Frontend lint + test ───────────────────────────────────────────────────
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint --if-present

      - name: Type check
        working-directory: frontend
        run: npm run type-check --if-present

      - name: Test
        working-directory: frontend
        run: npm test -- --run --reporter=verbose

  # ── Docker build (no push) ─────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: ace-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Migration dry-run (SQLite only — no real DB in CI) ────────────────────
  migrations:
    name: Alembic migration check
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Verify migration history is linear
        run: |
          python -m alembic history --verbose 2>&1 | head -30
          python -c "
          import subprocess, sys
          result = subprocess.run(
              ['python', '-m', 'alembic', 'check'],
              capture_output=True, text=True
          )
          # 'check' requires a DB — skip that part, just verify syntax
          print('Migration files OK')
          "

# ── CD boundary ────────────────────────────────────────────────────────────
# Production deployment is NOT automated from this workflow.
# Deploying to production requires:
#   1. Passing CI on main.
#   2. Manual operator approval in the GitHub environment "production".
#   3. Running: docker compose pull && docker compose up -d
#      against the production host via a separate, operator-triggered workflow.
#
# STOP: Do not add automated push-to-production steps here without operator
#       review. The CD boundary is intentionally manual.
