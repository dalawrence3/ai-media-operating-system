[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-engine"
version = "0.1.0"
description = "AI-assisted content production pipeline for YouTube Shorts: research, script generation, critique, narration, video assembly, and publishing, with human approval gates throughout."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.7,<3.0",
    "anthropic>=0.40,<2.0",
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12,<5.0",
    "pypdf>=4.0,<6.0",
    "elevenlabs>=2.61.0,<3.0",
    # Phase 15 — production infrastructure
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "redis[hiredis]>=5.0,<9.0",
    "rq>=2.10,<3.0",
    "PyJWT>=2.8,<3.0",
    "pwdlib[argon2]>=0.3,<1.0",
    "boto3>=1.34,<2.0",
    "structlog>=24.0,<26.0",
    "prometheus-client>=0.20,<1.0",
    "slowapi>=0.1,<1.0",
    # Phase 13/14 — HTTP transport layer
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.16,<1.0",
    "pytest-asyncio>=0.23,<1.0",
    "testcontainers[postgres,redis]>=4.7,<5.0",
]

[project.scripts]
ace = "app.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"app.ai" = ["prompts/**/*.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# B008: FastAPI Depends() in function signatures is the canonical DI pattern.
# The rule is correct in general but incompatible with FastAPI.
"src/app/api/**/*.py" = ["B008"]
