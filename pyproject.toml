[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-engine"
version = "0.1.0"
description = "AI-assisted content production pipeline for YouTube Shorts: research, script generation, critique, narration, video assembly, and publishing, with human approval gates throughout."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12,<1.0",
    "pydantic>=2.7,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
ace = "app.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
